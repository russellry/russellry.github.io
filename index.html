<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Russell Ong is an iOS app developer building polished Swift and SwiftUI apps from product concept to App Store release." />
    <title>Russell Ong - iOS App Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
      rel="stylesheet" />
    <link rel="icon" href="/assets/treasure-life-logo.webp" type="image/webp" />
    <script>
      // Match the stored theme before first paint to avoid a light flash.
      try {
        const saved = localStorage.getItem('theme');
        const dark =
          saved === 'dark' ||
          (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.style.backgroundColor = '#12140e';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-index.tsx"></script>
  </body>
</html>
